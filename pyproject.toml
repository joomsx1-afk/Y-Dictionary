[project]
name = "Y-Dictionary"
version = "2.1.0"
description = "AI British English Translator by Youssef"
dependencies = ["flet", "deep-translator", "requests", "SpeechRecognition", "standard-aifc", "gTTS"]

[tool.flet]
org = "com.youssef"
product = "Y Dictionary"

[tool.flet.android]
permissions = [
    "android.permission.INTERNET",
    "android.permission.RECORD_AUDIO",
    "android.permission.CAMERA",
    "android.permission.READ_EXTERNAL_STORAGE"
]
